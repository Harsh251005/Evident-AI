name: AI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: Run RAG Evaluation
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Generate answers ────────────────────────────────────────────────
      - name: Generate RAG answers
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL:         ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY:     ${{ secrets.QDRANT_API_KEY }}
          LANGSMITH_API_KEY:  ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING:  "true"
          LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
          LANGSMITH_PROJECT:  "evident-ai-tracing"
        run: python -m src.evaluation.run_generation --mode hybrid --top-k 5

      # ── 5. Run evaluation ──────────────────────────────────────────────────
      - name: Run RAGAS + LLM-as-Judge evaluation
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL:         ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY:     ${{ secrets.QDRANT_API_KEY }}
          LANGSMITH_API_KEY:  ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING:  "true"
          LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
          LANGSMITH_PROJECT:  "evident-ai-tracing"
        run: |
          python run_eval.py
          echo "exit code: $?"
          pwd
          ls -la

      # ── 6. Upload eval report as artifact ──────────────────────────────────
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          retention-days: 30

      # ── 7. Print report summary to CI logs ─────────────────────────────────
      - name: Print eval report
        if: always()
        run: |
          echo "====== EVAL REPORT ======"
          cat eval_report.json